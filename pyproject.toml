[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reknew"
version = "0.2.0"
description = "Project memories from a past place onto the surfaces of the room you are in now."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "PyQt6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
reknew = "reknew.ui.main_window:run"

[tool.setuptools.packages.find]
include = ["reknew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
